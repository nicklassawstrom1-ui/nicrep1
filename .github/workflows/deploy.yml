name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push to this branch.
# One-time setup: in the repo, go to Settings → Pages → "Build and deployment"
# and set Source to "GitHub Actions". (Public repo required on the free plan.)

on:
  push:
    branches: ['claude/bold-johnson-8yu55t']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages automatically if it isn't turned on yet,
          # so there's no manual Settings step required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
